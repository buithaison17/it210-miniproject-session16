<!doctype html>
<html lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title>MiniShop</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
</head>
<body>
<div class="container mx-auto">
    <header class="bg-white shadow-sm border-bottom">
        <div class="row align-items-center py-3">
            <div class="col-md-4 col-6">
                <a href="/admin" class="text-decoration-none">
                    <h4 class="text-primary m-0 font-weight-bold">MiniShop Admin</h4>
                </a>
            </div>
            <div class="col-md-8 col-6 text-right">
                <a href="/admin" class="btn btn-outline-primary mr-2">Tong quan</a>
                <a href="/admin/categories" class="btn btn-outline-secondary mr-2">Danh muc</a>
                <a href="/admin/products" class="btn btn-outline-secondary">San pham</a>
            </div>
        </div>
    </header>

    <main layout:fragment="content"></main>

    <footer class="bg-dark text-light py-3 mt-5">
        <div class="text-center">
            <small>MiniShop Admin</small>
        </div>
    </footer>
</div>

<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
</body>
</html>

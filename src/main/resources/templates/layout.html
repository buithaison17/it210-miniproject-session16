<!doctype html>
<html lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title>MiniShop</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
</head>
<body style="background-color: #f8f9fa;">
<div class="container bg-white px-0" style="max-width: 1380px; min-height: 100vh;">
    <header class="border-bottom">
        <div class="px-4 py-3 border-bottom">
            <div class="row align-items-center">
                <div class="col-md-6 col-12 mb-3 mb-md-0">
                    <a href="/cilent" class="text-decoration-none">
                        <h2 class="mb-0" style="color: #1e88ff; font-weight: 700;">MiniShop</h2>
                    </a>
                </div>
                <div class="col-md-6 col-12 text-md-right">
                    <a href="/user/cart" class="btn btn-outline-secondary mr-2">Giỏ hàng</a>
                    <a href="#" class="btn btn-outline-primary">Đăng xuất</a>
                </div>
            </div>
        </div>

        <nav class="navbar navbar-expand-lg navbar-light bg-white px-4 py-2 border-bottom">
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav">
                    <li class="nav-item mr-2"><a class="nav-link text-dark" href="/cilent">Trang chủ</a></li>
                    <li class="nav-item mr-2"><a class="nav-link text-dark" href="/cilent">Sản phẩm</a></li>
                    <li class="nav-item mr-2"><a class="nav-link text-dark" href="#">Danh mục</a></li>
                    <li class="nav-item"><a class="nav-link text-dark" href="#">Liên hệ</a></li>
                </ul>
            </div>
        </nav>

    </header>

    <main class="px-4 py-4">
        <div layout:fragment="content"></div>
    </main>

    <footer class="mt-4 px-4 py-4 text-white" style="background-color: #2f343a;">
        <div class="row">
            <div class="col-md-3 mb-3">
                <h4 class="font-weight-bold">MiniShop</h4>
                <p class="mb-0">Website thương mại điện tử mini demo bằng Spring Boot + Thymeleaf.</p>
            </div>
            <div class="col-md-3 mb-3">
                <h5 class="font-weight-bold">Liên kết</h5>
                <div><a href="/cilent" class="text-white">Trang chủ</a></div>
                <div><a href="/cilent" class="text-white">Sản phẩm</a></div>
                <div><a href="/user/cart" class="text-white">Giỏ hàng</a></div>
            </div>
            <div class="col-md-3 mb-3">
                <h5 class="font-weight-bold">Hỗ trợ</h5>
                <div><a href="#" class="text-white">Chính sách</a></div>
                <div><a href="#" class="text-white">Điều khoản</a></div>
                <div><a href="#" class="text-white">Liên hệ</a></div>
            </div>
            <div class="col-md-3 mb-3">
                <h5 class="font-weight-bold">Kết nối</h5>
                <div>Facebook</div>
                <div>Instagram</div>
                <div>TikTok</div>
            </div>
        </div>
    </footer>
</div>

<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
</body>
</html>

<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title>Thanh Toán - Mini Shop</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        .checkout-container { margin-top: 50px; margin-bottom: 50px; }
        .card { border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .btn-checkout { background-color: #28a745; color: white; font-weight: bold; }
        .btn-checkout:hover { background-color: #218838; }
    </style>
</head>
<body>
<div class="container checkout-container">
    <div class="row">
        <!-- CỘT TRÁI: FORM THÔNG TIN GIAO HÀNG -->
        <div class="col-md-7">
            <div class="card border-0">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Thông tin giao hàng</h4>
                </div>
                <div class="card-body">
                    <!-- Form gửi đến @PostMapping("/checkout") -->
                    <form th:action="@{/checkout}" method="post">
                        <div class="form-group">
                            <label for="customerName">Họ và tên người nhận</label>
                            <input type="text" class="form-control" id="customerName" name="customerName"
                                   placeholder="VD: Nguyễn Văn A" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 form-group">
                                <label for="phone">Số điện thoại</label>
                                <input type="tel" class="form-control" id="phone" name="phone"
                                       placeholder="09xxx" required>
                            </div>
                            <div class="col-md-6 form-group">
                                <label for="email">Email (Không bắt buộc)</label>
                                <input type="email" class="form-control" id="email" name="email"
                                       placeholder="name@example.com">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="address">Địa chỉ nhận hàng</label>
                            <textarea class="form-control" id="address" name="address" rows="3"
                                      placeholder="Số nhà, tên đường, xã/phường..." required></textarea>
                        </div>

                        <div class="form-group">
                            <label>Phương thức thanh toán</label>
                            <div class="custom-control custom-radio">
                                <input type="radio" id="cod" name="paymentMethod" class="custom-control-input" checked>
                                <label class="custom-control-label" for="cod">Thanh toán khi nhận hàng (COD)</label>
                            </div>
                        </div>

                        <hr class="mb-4">
                        <button class="btn btn-checkout btn-lg btn-block" type="submit">
                            XÁC NHẬN ĐẶT HÀNG
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- CỘT PHẢI: TÓM TẮT ĐƠN HÀNG -->
        <div class="col-md-5">
            <div class="card border-0">
                <div class="card-header bg-light">
                    <h4 class="d-flex justify-content-between align-items-center mb-0">
                        <span>Giỏ hàng của bạn</span>
                        <!-- Lấy size từ biến cart truyền từ model -->
                        <span class="badge badge-secondary badge-pill" th:text="${cart != null ? cart.size() : 0}">0</span>
                    </h4>
                </div>
                <div class="card-body">
                    <ul class="list-group list-group-flush mb-3">
                        <!-- SỬA TẠI ĐÂY: Lặp qua biến 'cart' được truyền từ Controller -->
                        <li th:each="entry : ${cart}" class="list-group-item d-flex justify-content-between lh-condensed">
                            <div>
                                <h6 class="my-0" th:text="${entry.key.name}">Tên sản phẩm</h6>
                                <small class="text-muted" th:text="'Số lượng: ' + ${entry.value}">Số lượng: 1</small>
                            </div>
                            <span class="text-muted" th:text="${#numbers.formatDecimal(entry.key.price * entry.value, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</span>
                        </li>

                        <li class="list-group-item d-flex justify-content-between bg-light">
                            <div class="text-success">
                                <h6 class="my-0">Phí vận chuyển</h6>
                            </div>
                            <span class="text-success">Miễn phí</span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between">
                            <span>Tổng cộng (VND)</span>
                            <strong class="text-danger" th:text="${#numbers.formatDecimal(totalPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</strong>
                        </li>
                    </ul>

                    <a href="/cart" class="btn btn-outline-secondary btn-sm btn-block">Chỉnh sửa giỏ hàng</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>

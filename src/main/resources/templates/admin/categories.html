<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Quan ly danh muc</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center my-4">
        <h2 class="mb-0">Quan ly danh muc</h2>
        <div>
            <button class="btn btn-primary" type="button">Them danh muc</button>
        </div>
    </div>

    <table class="table table-bordered table-hover">
        <thead class="thead-light">
        <tr>
            <th style="width: 80px">ID</th>
            <th>Ten danh muc</th>
            <th style="width: 160px">So san pham</th>
            <th style="width: 180px">Thao tac</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="category : ${categories}">
            <td th:text="${category.id}"></td>
            <td th:text="${category.name}"></td>
            <td th:text="${category.products != null ? category.products.size() : 0}"></td>
            <td>
                <button class="btn btn-sm btn-warning" type="button">Sua</button>
                <button class="btn btn-sm btn-danger" type="button">Xoa</button>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>

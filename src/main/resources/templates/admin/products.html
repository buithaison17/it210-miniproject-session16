<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Quan ly san pham</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center my-4">
        <h2 class="mb-0">Quan ly san pham</h2>
        <div>
            <button class="btn btn-primary" type="button">Them san pham</button>
        </div>
    </div>

    <table class="table table-bordered table-hover">
        <thead class="thead-light">
        <tr>
            <th style="width: 70px">ID</th>
            <th>Ten san pham</th>
            <th>Danh muc</th>
            <th style="width: 120px">Ton kho</th>
            <th style="width: 140px">Gia</th>
            <th style="width: 180px">Thao tac</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product : ${products}">
            <td th:text="${product.id}"></td>
            <td>
                <strong th:text="${product.name}"></strong>
                <div class="text-muted small" th:text="${product.description}"></div>
            </td>
            <td th:text="${product.category != null ? product.category.name : 'Chua co'}"></td>
            <td th:text="${product.stock}"></td>
            <td th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')}"></td>
            <td>
                <button class="btn btn-sm btn-warning" type="button">Sua</button>
                <button class="btn btn-sm btn-danger" type="button">Xoa</button>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>

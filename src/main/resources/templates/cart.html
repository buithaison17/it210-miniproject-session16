<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
</head>
<body>
<div layout:fragment="content" class="container mt-5">
    <h3 class="mb-4">🛒 Giỏ hàng của bạn</h3>
    <div class="row">
        <!-- Danh sách sản phẩm -->
        <div class="col-lg-8">
            <table class="table align-middle">
                <thead class="table-light">
                <tr>
                    <th>Sản phẩm</th>
                    <th>Giá</th>
                    <th>Số lượng</th>
                    <th>Tổng</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <!-- Item -->
                <tr th:each="item : ${cart}">
                    <td class="d-flex align-items-center">
                        <img th:src="${item.key.image}" class="me-3 rounded">
                        <div>
                            <h6 class="mb-0" th:text="${item.key.name}"></h6>
                            <small class="text-muted" th:text="${item.key.category.name}"></small>
                        </div>
                    </td>
                    <td>200.000đ</td>
                    <td style="width:120px;">
                        <input type="number" class="form-control" value="1" min="1">
                    </td>
                    <td>200.000đ</td>
                    <td>
                        <button class="btn btn-sm btn-danger">X</button>
                    </td>
                </tr>
                <!-- Item -->
                <tr>
                    <td class="d-flex align-items-center">
                        <img src="https://via.placeholder.com/60" class="me-3 rounded">
                        <div>
                            <h6 class="mb-0">Giày sneaker</h6>
                        </div>
                    </td>
                    <td>500.000đ</td>
                    <td>
                        <input type="number" class="form-control" value="2" min="1">
                    </td>
                    <td>1.000.000đ</td>
                    <td>
                        <button class="btn btn-sm btn-danger">X</button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <!-- Tổng tiền -->
        <div class="col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="mb-3">Tóm tắt đơn hàng</h5>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Tạm tính</span>
                        <span>1.200.000đ</span>
                    </div>
                    <div class="d-flex justify-content-between mb-3">
                        <span>Phí ship</span>
                        <span>30.000đ</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between fw-bold mb-3">
                        <span>Tổng</span>
                        <span class="text-danger">1.230.000đ</span>
                    </div>
                    <button class="btn btn-primary w-100 mb-2">Thanh toán</button>
                    <a href="/products" class="btn btn-outline-secondary w-100">← Tiếp tục mua</a>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Optional JavaScript -->
<!-- jQuery first, then Popper.js, then Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
</body>
</html>
